name: Unpack
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the zip
        run: |
          unzip -q slk_radar.zip -d /tmp/x
          rsync -a --exclude '.github' /tmp/x/slk_radar/ ./
          git rm -q slk_radar.zip
          git config user.name "unpack"
          git config user.email "unpack@users.noreply.github.com"
          git add -A
          git commit -m "Unpack radar files"
          git push
